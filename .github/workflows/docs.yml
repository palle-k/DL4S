name: Documentation

# Builds the DocC documentation for the DL4S target and publishes it to GitHub Pages.
# The repository setting "Build and deployment" of GitHub Pages must be "GitHub Actions".
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: DocC
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version

      # Rewrite readme for DocC compatibility
      - name: Generate the landing page from the README
        run: python3 util/docc_landing_page.py DL4S README.md Sources/DL4S/DL4S.docc/DL4S.md
      - name: Build documentation
        run: |
          swift package -Xswiftc -DDL4S_SKIP_MKL_PLATFORM_CHECK \
            --allow-writing-to-directory .build/docs \
            generate-documentation --target DL4S \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path DL4S \
            --output-path .build/docs
      - name: Redirect the site root to the module page
        run: |
          cat > .build/docs/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=documentation/dl4s/">
          <link rel="canonical" href="https://palle-k.github.io/DL4S/documentation/dl4s/">
          <title>DL4S Documentation</title>
          </head>
          <body>
          <a href="documentation/dl4s/">DL4S Documentation</a>
          </body>
          </html>
          HTML
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
