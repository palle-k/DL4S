name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.configuration }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        configuration: [debug, release]
    runs-on: ${{ matrix.os }}
    # The macro target compiles swift-syntax from source when no prebuilt library matches the toolchain.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with:
          swift-version: "6.2"
      - name: Show Swift version
        run: swift --version
      - name: Run tests (debug)
        if: matrix.configuration == 'debug'
        run: swift test
      - name: Run tests (release)
        if: matrix.configuration == 'release'
        run: swift test -c release -Xswiftc -enable-testing

  # The thread sanitizer runs on macOS only. On Linux, TSan does not see Synchronization.Mutex
  # (a futex in a precompiled module) and reports every access under the lock as a race.
  # Verified with Swift 6.1 and 6.3.3.
  tsan:
    name: thread sanitizer (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Run concurrency tests under the thread sanitizer
        run: swift test --sanitize=thread --filter Concurrency

  lint:
    name: lint (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Show Swift version
        run: swift --version
      - name: Check formatting
        run: swift package plugin --allow-writing-to-package-directory swiftformat --lint
      - name: Lint
        run: swift package plugin --allow-writing-to-package-directory swiftlint lint --strict
